[package]
name = "remotehand-target-monitor"
version = "1.0.0"
edition = "2021"
autobins = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ping = "0.9"
ureq = { version = "2.12", default-features = true }

[[bin]]
name = "remotehand-target-monitor"
path = "src/target_monitor.rs"
