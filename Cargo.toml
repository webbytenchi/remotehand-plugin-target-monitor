[package]
name = "remotehand-target-monitor"
version = "0.7.11"
edition = "2021"
autobins = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ping = "0.9"
ureq = { version = "2.12", default-features = true }
regex = "=1.12.2"

[[bin]]
name = "remotehand-target-monitor"
path = "src/main.rs"